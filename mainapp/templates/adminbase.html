{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blogify Admin</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="container-fluid">
        <div class="row header">
            <div class="col-sm-12 d-flex justify-content-between align-items-center py-3">
                <h4 class="ms-4 mb-0">Dashboard</h4>
                <div class="d-flex align-items-center gap-3 me-4">
                    <a href="{% url 'index' %}" class="text-decoration-none" style="color: #F0F0DB;">View Site</a>
                    <h5 class="mb-0">Welcome, {{ request.user.username|default:'Admin' }}</h5>
                </div>
            </div>
        </div>

        <div class="row main">
            <div class="col-sm-2 sidebar">
                <ul class="list-unstyled mt-4 text-center">
                    <li class="mb-4"><a href="{% url 'admindash' %}" class="nav-link">Dashboard</a></li>
                    <li class="mb-4"><a href="{% url 'addblog' %}" class="nav-link">Add Blogs</a></li>
                    <li class="mb-4"><a href="{% url 'viewsblog' %}" class="nav-link">View Blogs</a></li>
                </ul>
                <hr>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn rounded-pill w-100 px-5"
                        style="background-color: #ACBAC4; color: #30364F; font-weight: 600;">
                        Log Out
                    </button>
                </form>
            </div>

            <div class="col-sm-10 main-content" style="background-color: #F0F0DB;">
                {% if messages %}
                <div class="pt-3 px-3">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                {% block admin %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>
</html>
